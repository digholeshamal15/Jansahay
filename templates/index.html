<header class="header"><div class="header-inner"><a href="/" class="brand"><span class="brand-mark">ज<span></span></span><span>JanSahay<small data-i18n="brand_line"></small></span></a><nav class="main-nav" aria-label="Main navigation"><button data-page="home" class="nav-link active" data-i18n="nav_home"></button><button data-page="saved" class="nav-link"><span data-i18n="nav_saved"></span><span id="saved-count" class="count hidden"></span></button><button data-page="lab" class="nav-link" data-i18n="nav_assignments"></button></nav><div class="language-wrap"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg><select id="ui-language" aria-label="Language / भाषा"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select></div></div></header>

<label for="location" data-i18n="location_label"></label><input id="location" maxlength="160" required data-ph="location_placeholder"><details class="optional-details"><summary data-i18n="optional_details"></summary><div class="two-col"><div><label for="landmark" data-i18n="landmark"></label><input id="landmark" maxlength="160"></div><div><label for="duration" data-i18n="duration"></label><input id="duration" maxlength="120" data-ph="duration_ph"></div></div>
<div id="follow-question"></div><label for="recurring" data-i18n="recurring"></label><select id="recurring"></select><label for="extra" data-i18n="extra"></label><textarea id="extra" rows="2" maxlength="1000"></textarea>

<div id="assignment-cli" class="assignment-cli hidden"><h3 data-i18n="assignment_cli"></h3><pre id="assignment-command"></pre><p class="field-hint" data-i18n="assignment_cli_note"></p></div>
